name: Liste DoH pfSense

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_doh_list.py
      - name: Commit si la liste a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfsense/doh-ipv4.txt
          git diff --cached --quiet || git commit -m "Liste DoH : mise à jour automatique"
          git push
